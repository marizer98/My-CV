<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#E6E8E6"/>
  <!-- Minimalist Gallery Brand Mockup -->
  <g transform="translate(120, 70)">
    <!-- Main Poster Frame -->
    <rect width="320" height="460" rx="4" fill="#1B1E1B"/>
    <!-- Museum Monogram -->
    <text x="35" y="80" fill="#FFFFFF" font-family="'Cormorant Garamond', Georgia, serif" font-size="70" font-weight="300">M·A</text>
    <text x="35" y="115" fill="#A8B0A8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="3">MUSEO DE ARTE ACTUAL</text>
    <line x1="35" y1="135" x2="285" y2="135" stroke="#373D37" stroke-width="1"/>
    
    <!-- Abstract Artwork in Poster -->
    <rect x="35" y="160" width="250" height="200" fill="#242824"/>
    <ellipse cx="160" cy="260" rx="80" ry="50" fill="none" stroke="#D95338" stroke-width="2"/>
    <ellipse cx="160" cy="260" rx="50" ry="70" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="160" cy="260" r="10" fill="#D95338"/>
    
    <text x="35" y="395" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13">TEMPORADA 2026</text>
    <text x="35" y="415" fill="#8E998E" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Identidad integral, señalética y catálogo de sala</text>

    <!-- Side Collateral: Ticket & Tote Bag concept -->
    <g transform="translate(350, 30)">
      <!-- Entry Pass / Ticket -->
      <rect x="0" y="0" width="210" height="120" rx="4" fill="#FFFFFF"/>
      <rect x="0" y="0" width="8" height="120" fill="#D95338"/>
      <text x="25" y="35" fill="#141414" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">PASE DE ACCESO</text>
      <text x="25" y="52" fill="#777" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Exposición Central</text>
      <line x1="25" y1="70" x2="190" y2="70" stroke="#EEE" stroke-width="1" stroke-dasharray="3 3"/>
      <!-- Barcode simulation -->
      <rect x="25" y="80" width="165" height="25" fill="#242824"/>
      
      <!-- Tote Bag representation -->
      <g transform="translate(10, 150)">
        <rect x="0" y="40" width="190" height="220" rx="4" fill="#F4F1EA"/>
        <!-- Handle -->
        <path d="M50,40 C50,-20 140,-20 140,40" fill="none" stroke="#D1CCC2" stroke-width="8"/>
        <!-- Bag print -->
        <text x="95" y="140" fill="#141414" font-family="'Cormorant Garamond', Georgia, serif" font-size="36" font-style="italic" text-anchor="middle">M·A</text>
        <text x="95" y="165" fill="#777" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" letter-spacing="2" text-anchor="middle">ARTE CONTEMPORÁNEO</text>
      </g>
    </g>
  </g>
</svg>
