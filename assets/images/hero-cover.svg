<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F2EB"/>
      <stop offset="100%" stop-color="#EBE6DC"/>
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#141414" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="url(#heroBg)"/>
  
  <!-- Subtle Editorial Grid Lines -->
  <line x1="120" y1="0" x2="120" y2="800" stroke="#DDD7CC" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="800" stroke="#DDD7CC" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="1080" y1="0" x2="1080" y2="800" stroke="#DDD7CC" stroke-width="1"/>
  <line x1="0" y1="100" x2="1200" y2="100" stroke="#DDD7CC" stroke-width="1"/>
  <line x1="0" y1="700" x2="1200" y2="700" stroke="#DDD7CC" stroke-width="1"/>
  
  <!-- Editorial Card 1: Book / Publication Mockup -->
  <g transform="translate(180, 150)" filter="url(#subtleShadow)">
    <rect width="360" height="500" rx="4" fill="#FFFFFF"/>
    <rect x="0" y="0" width="360" height="30" fill="#202020"/>
    <text x="25" y="20" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="2">VOL. 04 / ESSAYS ON FORM</text>
    <text x="320" y="20" fill="#A0A0A0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">2026</text>
    
    <!-- Inner Poster Artwork -->
    <rect x="30" y="55" width="300" height="360" fill="#F4EFEA"/>
    <circle cx="180" cy="200" r="85" fill="#D95338" opacity="0.9"/>
    <circle cx="210" cy="225" r="50" fill="#202020"/>
    <line x1="60" y1="360" x2="300" y2="360" stroke="#202020" stroke-width="2"/>
    <text x="60" y="340" fill="#202020" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-style="italic">Sintaxis Visual</text>
    <text x="60" y="390" fill="#666666" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="1.5">INVESTIGACIÓN EDITORIAL & RETÍCULA</text>
    
    <text x="30" y="460" fill="#141414" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13">ESTUDIO TIPOGRÁFICO</text>
    <text x="30" y="478" fill="#888888" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Dirección de arte y composición editorial</text>
  </g>

  <!-- Editorial Card 2: Visual Identity Brand Collateral Mockup -->
  <g transform="translate(620, 190)" filter="url(#subtleShadow)">
    <rect width="400" height="460" rx="4" fill="#1C1C1C"/>
    
    <!-- Business card inside -->
    <g transform="translate(40, 45)">
      <rect width="320" height="190" rx="3" fill="#F8F6F0"/>
      <!-- Embossed Logo Mark -->
      <path d="M40,55 L55,25 L70,55 L55,85 Z" fill="#D95338"/>
      <path d="M55,40 L70,70 L85,40 Z" fill="#1C1C1C" opacity="0.8"/>
      <text x="105" y="55" fill="#1C1C1C" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" letter-spacing="3">AURA</text>
      <text x="105" y="72" fill="#777777" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" letter-spacing="1">STUDIO DE DISEÑO</text>
      <line x1="40" y1="125" x2="280" y2="125" stroke="#E5E0D6" stroke-width="1"/>
      <text x="40" y="150" fill="#444444" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Identidad, sistemas & dirección creativa</text>
      <text x="40" y="168" fill="#888888" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">contacto@aurastudio.com</text>
    </g>

    <!-- Palette Swatches -->
    <g transform="translate(40, 265)">
      <rect x="0" y="0" width="70" height="60" rx="2" fill="#D95338"/>
      <rect x="80" y="0" width="70" height="60" rx="2" fill="#F8F6F0"/>
      <rect x="160" y="0" width="70" height="60" rx="2" fill="#8E9B90"/>
      <rect x="240" y="0" width="70" height="60" rx="2" fill="#2E2E2E"/>
      <text x="0" y="80" fill="#888888" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" letter-spacing="1">PALETA CROMÁTICA</text>
    </g>
    
    <text x="40" y="380" fill="#FFFFFF" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-style="italic">Identidad de Marca & Sistema Gráfico</text>
    <text x="40" y="415" fill="#999999" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Papelería corporativa, guía de estilo y packaging</text>
  </g>

  <!-- Editorial Accents -->
  <text x="120" y="80" fill="#8A857B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="3">FIG. 01 — SELECCIÓN DE PROYECTOS</text>
  <text x="1080" y="80" fill="#8A857B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="2" text-anchor="end">2024 — 2026</text>
</svg>
