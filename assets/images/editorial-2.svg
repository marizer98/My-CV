<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#EAE5DC"/>
  <!-- Minimalist Book / Monograph Cover Mockup -->
  <g transform="translate(230, 60)">
    <rect width="340" height="480" rx="6" fill="#181818"/>
    <!-- Book Spine 3D simulation -->
    <rect width="20" height="480" fill="#0F0F0F" rx="3"/>
    
    <!-- Cover Content -->
    <text x="50" y="70" fill="#EAE5DC" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="3">COLECCIÓN TIPOGRÁFICA</text>
    <line x1="50" y1="90" x2="300" y2="90" stroke="#444" stroke-width="1"/>
    
    <!-- Big Editorial Monogram Artwork -->
    <text x="50" y="220" fill="#EAE5DC" font-family="'Cormorant Garamond', Georgia, serif" font-size="110" font-weight="300">Aa</text>
    <text x="190" y="220" fill="#D95338" font-family="'Cormorant Garamond', Georgia, serif" font-size="110" font-style="italic">&amp;</text>
    
    <text x="50" y="280" fill="#FFFFFF" font-family="'Cormorant Garamond', Georgia, serif" font-size="34">Anatomía del Tipo</text>
    <text x="50" y="315" fill="#A0A0A0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="300">Principios de composición, jerarquía y ritmo visual en la era contemporánea.</text>
    
    <!-- Geometric framing -->
    <rect x="50" y="350" width="250" height="70" fill="none" stroke="#333" stroke-width="1"/>
    <text x="70" y="380" fill="#EAE5DC" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="1.5">EDICIÓN LIMITADA 500 EJEMPLARES</text>
    <text x="70" y="400" fill="#777" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">DISEÑO Y ENCUADERNACIÓN SUIZA</text>
  </g>
</svg>
