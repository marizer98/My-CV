<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#EFECE6"/>
  <!-- Packaging Scene Mockup -->
  <g transform="translate(150, 70)">
    <!-- Dropper Bottle -->
    <g transform="translate(60, 40)">
      <!-- Cap & Pipette -->
      <rect x="55" y="10" width="30" height="60" rx="3" fill="#1A1A1A"/>
      <rect x="62" y="0" width="16" height="12" rx="4" fill="#333333"/>
      <!-- Bottle Body (Amber Glass) -->
      <rect x="25" y="70" width="90" height="260" rx="14" fill="#7D4B26"/>
      <!-- Highlight -->
      <rect x="33" y="80" width="8" height="240" rx="4" fill="#A56E42" opacity="0.6"/>
      <!-- Label -->
      <rect x="30" y="130" width="80" height="150" fill="#F7F5F0"/>
      <text x="70" y="160" fill="#1A1A1A" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" letter-spacing="2" text-anchor="middle">BOTÁNICA</text>
      <line x1="45" y1="172" x2="95" y2="172" stroke="#D5CEC2" stroke-width="0.8"/>
      <text x="70" y="195" fill="#7D4B26" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-style="italic" text-anchor="middle">Sérum Facial</text>
      <text x="70" y="215" fill="#777" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" letter-spacing="1" text-anchor="middle">30 ML / 1.0 FL OZ</text>
      <text x="70" y="240" fill="#999" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" text-anchor="middle">Extracto de Rosa Mosqueta</text>
    </g>

    <!-- Cosmetic Box Mockup -->
    <g transform="translate(230, 40)">
      <!-- Box Outer Front -->
      <rect x="0" y="30" width="160" height="300" rx="4" fill="#FDFCFA"/>
      <!-- Embossed Foil Detail -->
      <rect x="15" y="45" width="130" height="270" fill="none" stroke="#E2DBD1" stroke-width="1"/>
      <text x="80" y="90" fill="#1A1A1A" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" letter-spacing="3" text-anchor="middle">BOTÁNICA</text>
      <text x="80" y="110" fill="#8E7E73" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" letter-spacing="1" text-anchor="middle">CUIDADO DE LA PIEL ORGÁNICO</text>
      
      <!-- Minimalist Branch Illustration -->
      <circle cx="80" cy="180" r="35" fill="#F4EFE9"/>
      <path d="M80,155 Q95,175 80,205 Q65,175 80,155 Z" fill="#7D4B26" opacity="0.6"/>
      
      <text x="80" y="250" fill="#1A1A1A" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-style="italic" text-anchor="middle">Crema Reparadora</text>
      <text x="80" y="275" fill="#777" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Fórmula Nutritiva Nocturna</text>
    </g>

    <!-- Small Jar -->
    <g transform="translate(370, 180)">
      <rect x="10" y="0" width="100" height="30" rx="4" fill="#1A1A1A"/>
      <rect x="0" y="30" width="120" height="120" rx="8" fill="#FDFCFA"/>
      <rect x="10" y="60" width="100" height="60" fill="#F7F5F0"/>
      <text x="60" y="85" fill="#1A1A1A" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" letter-spacing="2" text-anchor="middle">BOTÁNICA</text>
      <text x="60" y="105" fill="#7D4B26" font-family="'Cormorant Garamond', Georgia, serif" font-size="11" font-style="italic" text-anchor="middle">Bálsamo Labial</text>
    </g>
  </g>

  <!-- Surface line -->
  <line x1="120" y1="440" x2="680" y2="440" stroke="#DDD7CC" stroke-width="2"/>
</svg>
