<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#F2EEE6"/>
  <!-- Art Poster Frame -->
  <g transform="translate(180, 50)">
    <rect width="440" height="500" rx="4" fill="#FFFFFF"/>
    <!-- Outer Risograph Border -->
    <rect x="25" y="25" width="390" height="450" fill="#FAF6EE"/>
    
    <!-- Abstract Geometric Art -->
    <circle cx="220" cy="180" r="110" fill="#D95338" opacity="0.85"/>
    <rect x="110" y="160" width="220" height="140" fill="#202020" opacity="0.85" rx="2"/>
    <line x1="80" y1="280" x2="360" y2="280" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="80" y1="295" x2="360" y2="295" stroke="#FFFFFF" stroke-width="1"/>
    
    <!-- Halftone / line patterns -->
    <g opacity="0.6">
      <line x1="130" y1="180" x2="130" y2="240" stroke="#F2EEE6" stroke-width="2"/>
      <line x1="150" y1="180" x2="150" y2="240" stroke="#F2EEE6" stroke-width="2"/>
      <line x1="170" y1="180" x2="170" y2="240" stroke="#F2EEE6" stroke-width="2"/>
      <line x1="190" y1="180" x2="190" y2="240" stroke="#F2EEE6" stroke-width="2"/>
      <line x1="210" y1="180" x2="210" y2="240" stroke="#F2EEE6" stroke-width="2"/>
      <line x1="230" y1="180" x2="230" y2="240" stroke="#F2EEE6" stroke-width="2"/>
    </g>

    <text x="50" y="375" fill="#141414" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-style="italic">Estudio Cinético No. 04</text>
    <text x="50" y="405" fill="#666" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="2">SERIGRAFÍA EXPERIMENTAL EN 3 TINTAS</text>
    <text x="50" y="440" fill="#999" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">EXPLORACIÓN DE TANGENCIAS, RETÍCULAS Y SUPERPOSICIÓN</text>
    <text x="380" y="440" fill="#141414" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" text-anchor="end">04 / 20</text>
  </g>
</svg>
