<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#F4EFE9"/>
  <!-- Branding Collateral Grid -->
  <g transform="translate(100, 60)">
    <!-- Stationery Sheet -->
    <rect x="0" y="0" width="340" height="460" rx="4" fill="#FFFFFF"/>
    <!-- Minimalist Monogram -->
    <circle cx="60" cy="65" r="24" fill="#202020"/>
    <text x="60" y="73" fill="#F4EFE9" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="700" text-anchor="middle">K</text>
    <text x="100" y="62" fill="#141414" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" letter-spacing="3">KROMA</text>
    <text x="100" y="76" fill="#888" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" letter-spacing="1">SPECIALTY COFFEE LAB</text>
    
    <line x1="40" y1="120" x2="300" y2="120" stroke="#EAE5DC" stroke-width="1"/>
    
    <text x="40" y="155" fill="#141414" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-style="italic">Sistema de Identidad Visual</text>
    <!-- Placeholder text lines -->
    <line x1="40" y1="180" x2="260" y2="180" stroke="#E5E0D6" stroke-width="2"/>
    <line x1="40" y1="195" x2="280" y2="195" stroke="#E5E0D6" stroke-width="2"/>
    <line x1="40" y1="210" x2="240" y2="210" stroke="#E5E0D6" stroke-width="2"/>
    
    <!-- Stamp watermark -->
    <circle cx="250" cy="360" r="45" fill="none" stroke="#D95338" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="250" y="358" fill="#D95338" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" letter-spacing="1" text-anchor="middle">ORIGEN ÚNICO</text>
    <text x="250" y="372" fill="#D95338" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" text-anchor="middle">2025</text>

    <!-- Business Cards Overlap -->
    <g transform="translate(360, 40)">
      <!-- Card 1 Front -->
      <rect x="0" y="0" width="220" height="135" rx="4" fill="#202020"/>
      <circle cx="110" cy="55" r="22" fill="#D95338"/>
      <text x="110" y="63" fill="#FFFFFF" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="700" text-anchor="middle">K</text>
      <text x="110" y="105" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" letter-spacing="3" text-anchor="middle">KROMA</text>
      
      <!-- Card 2 Back -->
      <g transform="translate(20, 160)">
        <rect x="0" y="0" width="220" height="135" rx="4" fill="#E8DEC8"/>
        <text x="25" y="45" fill="#202020" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">MARIANA SILVA</text>
        <text x="25" y="60" fill="#666" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Dirección Creativa</text>
        <line x1="25" y1="75" x2="195" y2="75" stroke="#D2C5AB" stroke-width="1"/>
        <text x="25" y="95" fill="#333" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">hola@kromacoffee.com</text>
        <text x="25" y="110" fill="#333" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">+52 55 0000 0000</text>
      </g>

      <!-- Color Palette swatches -->
      <g transform="translate(0, 320)">
        <rect x="0" y="0" width="55" height="50" rx="3" fill="#202020"/>
        <rect x="65" y="0" width="55" height="50" rx="3" fill="#D95338"/>
        <rect x="130" y="0" width="55" height="50" rx="3" fill="#E8DEC8"/>
        <rect x="195" y="0" width="45" height="50" rx="3" fill="#F4EFE9"/>
        <text x="0" y="70" fill="#888" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" letter-spacing="1">GUÍA DE MARCA</text>
      </g>
    </g>
  </g>
</svg>
