<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#F4EFEA"/>
  <!-- Editorial Grid -->
  <line x1="80" y1="0" x2="80" y2="600" stroke="#E2DBD1" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="600" stroke="#E2DBD1" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="600" stroke="#E2DBD1" stroke-width="1"/>
  
  <!-- Magazine Spread Mockup -->
  <g transform="translate(100, 70)">
    <!-- Left Page -->
    <rect x="0" y="0" width="290" height="420" fill="#FFFFFF" rx="2"/>
    <rect x="25" y="30" width="240" height="180" fill="#1C1C1C"/>
    <circle cx="145" cy="120" r="50" fill="#D95338" opacity="0.85"/>
    <text x="25" y="240" fill="#141414" font-family="'Cormorant Garamond', Georgia, serif" font-size="26" font-style="italic">La Forma del Silencio</text>
    <text x="25" y="265" fill="#888888" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" letter-spacing="2">ENSAYO SOBRE ESPACIO NEGATIVO</text>
    <!-- Text columns simulation -->
    <line x1="25" y1="290" x2="135" y2="290" stroke="#DDD" stroke-width="2"/>
    <line x1="25" y1="305" x2="135" y2="305" stroke="#DDD" stroke-width="2"/>
    <line x1="25" y1="320" x2="135" y2="320" stroke="#DDD" stroke-width="2"/>
    <line x1="25" y1="335" x2="110" y2="335" stroke="#DDD" stroke-width="2"/>
    
    <line x1="150" y1="290" x2="265" y2="290" stroke="#DDD" stroke-width="2"/>
    <line x1="150" y1="305" x2="265" y2="305" stroke="#DDD" stroke-width="2"/>
    <line x1="150" y1="320" x2="265" y2="320" stroke="#DDD" stroke-width="2"/>
    <line x1="150" y1="335" x2="230" y2="335" stroke="#DDD" stroke-width="2"/>
    <text x="25" y="380" fill="#999" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">PÁG. 42</text>

    <!-- Center fold shadow -->
    <rect x="285" y="0" width="10" height="420" fill="#EAE5DC" opacity="0.6"/>

    <!-- Right Page -->
    <rect x="295" y="0" width="290" height="420" fill="#FAF8F5" rx="2"/>
    <text x="325" y="60" fill="#141414" font-family="'Cormorant Garamond', Georgia, serif" font-size="52" font-weight="300">Nº 08</text>
    <line x1="325" y1="80" x2="550" y2="80" stroke="#141414" stroke-width="1.5"/>
    <text x="325" y="115" fill="#444444" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="1">REVISTA DE ARQUITECTURA & DISEÑO</text>
    
    <rect x="325" y="145" width="230" height="200" fill="#E8E2D8"/>
    <path d="M355,305 L440,180 L525,305 Z" fill="#D95338" opacity="0.3"/>
    <path d="M390,305 L475,210 L555,305 Z" fill="#1C1C1C" opacity="0.4"/>
    <text x="325" y="380" fill="#999" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">PÁG. 43</text>
  </g>

  <!-- Caption overlay -->
  <rect x="100" y="525" width="600" height="45" fill="#FFFFFF" rx="4"/>
  <text x="125" y="552" fill="#141414" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">EDITORIAL: Revista 'Materia & Forma'</text>
  <text x="670" y="552" fill="#888888" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="end">Editorial / Tipografía / 2025</text>
</svg>
