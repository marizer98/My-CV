<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#E8EBE4"/>
  <!-- Wine / Olive Oil Bottle Minimalist Mockup -->
  <g transform="translate(250, 40)">
    <!-- Neck -->
    <rect x="120" y="20" width="60" height="110" fill="#2B3629"/>
    <!-- Wax seal top -->
    <rect x="115" y="10" width="70" height="25" rx="3" fill="#D95338"/>
    <!-- Shoulder -->
    <path d="M120,130 C120,170 50,200 50,240 L250,240 C250,200 180,170 180,130 Z" fill="#2B3629"/>
    <!-- Body -->
    <rect x="50" y="240" width="200" height="260" rx="4" fill="#2B3629"/>
    <!-- Glass Highlight -->
    <rect x="65" y="245" width="12" height="250" rx="4" fill="#3D4D3A" opacity="0.8"/>
    
    <!-- Die-cut Paper Label -->
    <rect x="75" y="260" width="150" height="210" rx="2" fill="#FBF9F5"/>
    <text x="150" y="295" fill="#2B3629" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" letter-spacing="3" text-anchor="middle">COSECHA FAMILIAR</text>
    <line x1="100" y1="308" x2="200" y2="308" stroke="#D1CDC4" stroke-width="0.8"/>
    
    <text x="150" y="345" fill="#1A1A1A" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-style="italic" text-anchor="middle">Olivo Noble</text>
    <text x="150" y="370" fill="#888" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" letter-spacing="1.5" text-anchor="middle">ACEITE DE OLIVA EXTRA VIRGEN</text>
    <circle cx="150" cy="405" r="18" fill="#E8EBE4"/>
    <circle cx="150" cy="405" r="8" fill="#7D4B26"/>
    <text x="150" y="445" fill="#2B3629" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" text-anchor="middle">500 ML / PRENSADO EN FRÍO</text>
  </g>
  <line x1="150" y1="520" x2="650" y2="520" stroke="#CDD3C7" stroke-width="2"/>
</svg>
